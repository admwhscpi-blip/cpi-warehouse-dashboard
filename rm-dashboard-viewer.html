<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART WAREHOUSE V2.0 - RM Stock Live</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- STYLES -->
    <link rel="stylesheet" href="css/rm_stock_v2.css">
    <link rel="stylesheet" href="homepage-style.css">

    <style>
        /* Navbar Tweaks for this page */
        .navbar {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.95);
            z-index: 1000;
        }

        /* Mobile Responsiveness Overrides */
        @media (max-width: 768px) {
            #live-dashboard {
                padding: 30px 15px !important;
            }
            .section-header {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 20px !important;
                text-align: center !important;
                margin-bottom: 25px !important;
            }
            .mini-clock-wrapper {
                transform: scale(1) !important;
                transform-origin: center center !important;
                display: flex !important;
                justify-content: center !important;
                margin: 0 auto !important;
            }
            .section-header h2 {
                font-size: 1.6rem !important;
                justify-content: center !important;
                letter-spacing: 2px !important;
            }
            .section-header > div:last-child {
                display: flex !important;
                justify-content: center !important;
                width: 100% !important;
            }
            
            /* Global Stats Card Grid Stack */
            #global-stats {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
                margin-bottom: 30px !important;
            }
            
            /* Sticky specs headers on horizontal scroll for warehouse rows */
            .warehouse-card-header {
                position: sticky !important;
                left: 0 !important;
                background: #050505 !important;
                z-index: 12 !important;
                box-shadow: 8px 0 10px -5px rgba(0,0,0,0.7) !important;
            }
            
            /* Stack Analytics layout cards */
            .analytics-layout-grid {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
                margin-top: 30px !important;
            }
        }
        @media (max-width: 480px) {
            #category-chart-container {
                flex-direction: column !important;
                gap: 20px !important;
            }
            #category-chart-container > div {
                margin-left: 0 !important;
                width: 100% !important;
            }
        }
    </style>
</head>

<body style="background-color: #050505; color: #fff;">

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text-main">WAIT JURAGAN...</div>
        <div class="loading-text-sub">SEDANG AMBIL DATA DARI SHEETS<br>(PASTIKAN JARINGAN LANCAR)</div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a class="logo-link" style="cursor:default;">
            <div class="logo-text">
                <span class="brand-smart">SMART WAREHOUSE</span>
                <span class="brand-v2">V2.0</span>
            </div>
        </a>

        <div class="nav-links">
            <!-- MENU DIKOSONGKAN SESUAI INSTRUKSI -->
        </div>

        <div class="nav-actions">
            <!-- TOMBOL KEMBALI KE HOME DIHAPUS -->
        </div>
    </nav>

    <!-- LIVE DASHBOARD SECTION -->
    <section id="live-dashboard" style="padding:50px 60px;">
        <div class="section-header"
            style="margin-bottom:40px; display:flex; justify-content:flex-start; align-items:center; gap:25px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:20px;">
            
            <!-- MINI PREMIUM CLOCK -->
            <div class="mini-clock-wrapper" style="margin:0; width:auto; transform:scale(0.85); transform-origin:left center; opacity:1;">
                <div class="clock-container" id="clock-widget" style="min-width:unset; margin:0; background:rgba(15,23,42,0.6); box-shadow:0 0 20px rgba(14, 165, 233, 0.2);">
                    <div class="clock-date-group">
                        <div class="clock-day" id="widget-day">DAY</div>
                        <div class="clock-date" id="widget-date">DATE</div>
                    </div>
                    <div class="clock-visual">
                        <div class="clock-circle"></div>
                        <div class="clock-progress" id="widget-sec-progress"></div>
                        <div class="clock-time-group">
                            <div class="clock-ampm" id="widget-ampm">AM</div>
                            <div class="clock-time" id="widget-time">00:00</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TITLE WITH CYBER EFFECTS -->
            <div style="display:flex; flex-direction:column; justify-content:center; position:relative; margin-left: -5px;">
                <h2 style="font-family:'Orbitron'; font-size:2.2rem; font-weight:900; letter-spacing:3px; margin:0; text-transform:uppercase; text-shadow:0 0 20px rgba(0,243,255,0.4); display:flex; gap:10px; align-items:center;">
                    <span style="color:#e2e8f0;">LIVE</span> 
                    <span style="background:linear-gradient(90deg, #fff, #00f3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">MATERIAL</span> 
                    <span style="color:#00f3ff; text-shadow:0 0 15px #00f3ff, 0 0 30px #00f3ff;">STOCK</span>
                </h2>
                <!-- Scanner Line Effect under title -->
                <div style="position:relative; width:100%; height:2px; background:linear-gradient(90deg, transparent, #00f3ff, #bc13fe, transparent); box-shadow:0 0 10px #00f3ff; margin-top:2px;"></div>
                <div style="color:#94a3b8; font-size:0.8rem; margin-top:8px; font-family:'Orbitron'; letter-spacing:2px; text-transform:uppercase; opacity:0.8;">Real-time inventory synchronization</div>
            </div>
            
            <div style="flex-grow:1;"></div>
        </div>

        <!-- VIEW 1: STOCK MONITOR -->
        <div id="view-stock" style="display:block;">
            <div id="module-rm">
                <!-- GLOBAL STATS -->
                <div id="global-stats" class="stats-container"
                    style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom:40px;">
                    <!-- Filled by JS -->
                </div>

                <!-- WAREHOUSE GRID -->
                <div id="warehouse-display" class="warehouse-grid">
                    <!-- Filled by JS -->
                </div>

                <!-- ANALYTICS GRID (Top 10 & Donut) -->
                <div class="analytics-layout-grid"
                    style="margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <!-- TOP MATERIALS -->
                    <div class="card-analytics"
                        style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px;">
                        <h3
                            style="font-family:'Orbitron'; color:#fff; border-left:3px solid #bc13fe; padding-left:10px; margin-bottom:20px;">
                            🏆 Top Materials</h3>
                        <div id="top-items-table"></div>
                    </div>

                    <!-- CATEGORY DISTRIBUTION -->
                    <div class="card-analytics"
                        style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px;">
                        <h3
                            style="font-family:'Orbitron'; color:#fff; border-left:3px solid #bc13fe; padding-left:10px; margin-bottom:20px;">
                            📊 Category Distribution</h3>
                        <div id="category-chart-container"
                            style="display:flex; justify-content:space-around; align-items:center;"></div>
                        <div id="rm-search-wrap" style="margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.08);">
                            <h4 style="font-family:'Orbitron',sans-serif;font-size:0.75rem;color:#94a3b8;margin:0 0 10px 0;letter-spacing:2px;">SEARCH MATERIAL</h4>
                            <input type="search" id="rm-search-input" placeholder="Ketik nama material (min. 2 huruf)…" autocomplete="off"
                                style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#fff;padding:10px 12px;border-radius:8px;font-family:Inter,sans-serif;font-size:0.85rem;margin-bottom:10px;">
                            <div id="rm-search-results" style="max-height:340px;overflow-y:auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </section>

    <!-- MODAL DETAIL WAREHOUSE -->
    <div id="warehouse-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;">
        <div class="modal-content"
            style="background:#0a0a0a; width:90%; max-width:800px; max-height:90vh; border:2px solid #00f3ff; border-radius:12px; box-shadow:0 0 50px rgba(0,243,255,0.2); overflow:hidden; display:flex; flex-direction:column;">

            <!-- HEADER -->
            <div class="modal-header"
                style="padding:20px 30px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; background:rgba(0,243,255,0.05);">
                <h2 id="modal-title" style="font-family:'Orbitron'; color:#00f3ff; margin:0; text-transform:uppercase;">
                    DETAIL GUDANG: -</h2>
                <button onclick="closeModal()"
                    style="background:transparent; border:none; color:#fff; font-size:1.5rem; cursor:pointer; font-weight:bold;">&times;</button>
            </div>

            <!-- BODY (Scrollable) -->
            <div class="modal-body" style="padding:0; overflow-y:auto; flex:1;">
                <table style="width:100%; border-collapse:collapse;">
                    <thead style="position:sticky; top:0; background:#0f172a; z-index:1;">
                        <tr>
                            <th
                                style="padding:15px 30px; text-align:left; color:#64748b; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">
                                Item Name</th>
                            <th
                                style="padding:15px 30px; text-align:right; color:#64748b; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">
                                Inventory Level (TON)</th>
                        </tr>
                    </thead>
                    <tbody id="modal-list-body">
                        <!-- Items injected here -->
                    </tbody>
                </table>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer"
                style="padding:15px 30px; border-top:1px solid #333; background:#0a0a0a; text-align:right;">
                <button onclick="closeModal()"
                    style="padding:8px 24px; background:#333; color:#fff; border:1px solid #555; border-radius:4px; font-family:'Orbitron'; cursor:pointer; transition:all 0.3s;">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS FOR DATA LOGIC -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app-config.js?v=1202"></script>
    <script src="js/app-data.js?v=1202"></script>

    <script>
        // --- DASHBOARD SPECIFIC CONTROLLER ---

        const App = { data: null, liveData: null, viewMode: 'live' };
        var rmSearchTimer = null;

        function rmEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatKgToTon(kgValue) {
            if (kgValue == null || isNaN(kgValue)) return '0,00';
            const divider = (typeof CONFIG !== 'undefined' && CONFIG.UNIT_DIVIDER) ? CONFIG.UNIT_DIVIDER : 1000;
            const tonValue = kgValue / divider;
            return tonValue.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function applyRmDashboardData(raw) {
            var data = typeof DataService.sanitizeRmDashboard === 'function' ? DataService.sanitizeRmDashboard(raw) : raw;
            if (!data) return;
            App.data = data;
            App._fullData = data;
            renderGlobalStats(DataService.processGlobalStats(App.data));
            renderWarehouseCards(App.data);
            var analytics = DataService.getAnalytics(App.data);
            renderAnalytics(analytics);
            var categories = DataService.getCategoryStats(App.data);
            renderCategoryStats(categories);
            rmRunMaterialSearch();
        }

        function rmRunMaterialSearch() {
            var inp = document.getElementById('rm-search-input');
            var out = document.getElementById('rm-search-results');
            if (!inp || !out || !App.data) return;
            var q = inp.value.trim();
            if (q.length < 2) {
                out.innerHTML = '';
                return;
            }
            var rows = DataService.searchMaterials(App.data, q);
            if (!rows.length) {
                out.innerHTML = '<span style="color:#64748b;font-size:0.75rem;">Tidak ada material cocok.</span>';
                return;
            }
            var html = '';
            rows.forEach(function (r) {
                html += '<div style="margin-bottom:14px;padding:12px;border-radius:8px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);">';
                html += '<div style="font-weight:700;color:#00f3ff;font-size:0.85rem;margin-bottom:8px;font-family:Rajdhani,sans-serif;">' + rmEsc(r.name) + '</div>';
                html += '<div style="color:#94a3b8;font-size:0.7rem;margin-bottom:6px;">Total: <strong style="color:#fff;">' + r.totalTon.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '</strong> TON</div>';
                html += '<table style="width:100%;font-size:0.72rem;border-collapse:collapse;"><thead><tr><th style="text-align:left;color:#64748b;padding:4px 0;">Gudang</th><th style="text-align:right;color:#64748b;padding:4px 0;">Stok (TON)</th><th style="text-align:right;color:#64748b;padding:4px 0;">%</th></tr></thead><tbody>';
                r.distribution.forEach(function (d) {
                    html += '<tr><td style="padding:3px 0;color:#cbd5e1;">' + rmEsc(d.warehouse) + '</td><td style="padding:3px 0;text-align:right;color:#fff;font-weight:600;">' + d.qtyTon.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '</td><td style="padding:3px 0;text-align:right;color:#64748b;">' + d.percent.toFixed(0) + '%</td></tr>';
                });
                html += '</tbody></table></div>';
            });
            out.innerHTML = html;
        }

        // --- MODAL LOGIC ---
        function openDetailModal(warehouseIndex) {
            const useData = App._fullData || App.data;
            const whName = useData.warehouses[warehouseIndex];
            const modal = document.getElementById('warehouse-modal');
            const title = document.getElementById('modal-title');
            const tbody = document.getElementById('modal-list-body');
            const thead = document.querySelector('#warehouse-modal thead tr');

            title.innerText = `DETAIL GUDANG: ${whName}`;
            
            // Restore Warehouse Headers
            thead.innerHTML = `
                <th style="padding:15px 30px; text-align:left; color:#64748b; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">Item Name</th>
                <th style="padding:15px 30px; text-align:right; color:#64748b; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">Inventory Level (TON)</th>
            `;

            tbody.innerHTML = ''; // Clear previous

            // Collect items for this warehouse
            const items = [];
            useData.materials.forEach(mat => {
                const stockVal = mat.stocks[warehouseIndex] || 0;
                if (stockVal > 0) {
                    items.push({ name: mat.name, qty: stockVal });
                }
            });

            // Sort by quantity desc
            items.sort((a, b) => b.qty - a.qty);

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="padding:30px; text-align:center; color:#666;">No items stored in this facility.</td></tr>';
            } else {
                items.forEach(item => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    row.style.transition = 'background 0.2s';
                    row.onmouseenter = () => row.style.background = 'rgba(0,243,255,0.05)';
                    row.onmouseleave = () => row.style.background = 'transparent';

                    row.innerHTML = `
                        <td style="padding:15px 30px; color:#cbd5e1; font-weight:500;">${item.name}</td>
                        <td style="padding:15px 30px; text-align:right; color:#fff; font-family:'Rajdhani'; font-weight:700; font-size:1.1rem;">${formatKgToTon(item.qty)}</td>
                    `;
                    tbody.appendChild(row);
                });
            }

            modal.style.display = 'flex';
        }

        function openMaterialModal(matName) {
            const mat = App.data.materials.find(m => m.name === matName);
            if (!mat) return;

            const modal = document.getElementById('warehouse-modal');
            const title = document.getElementById('modal-title');
            const tbody = document.getElementById('modal-list-body');
            const thead = document.querySelector('#warehouse-modal thead tr');

            title.innerText = `DISTRIBUSI GUDANG: ${matName}`;
            
            // Set Headers for Material View
            thead.innerHTML = `
                <th style="padding:15px 30px; text-align:left; color:#bc13fe; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">Fasilitas Gudang</th>
                <th style="padding:15px 30px; text-align:right; color:#bc13fe; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #333;">Stock Terisi (TON)</th>
            `;

            tbody.innerHTML = '';

            const items = [];
            App.data.warehouses.forEach((whName, idx) => {
                const stockVal = mat.stocks[idx] || 0;
                if (stockVal > 0) {
                    items.push({ name: whName, qty: stockVal });
                }
            });

            items.sort((a, b) => b.qty - a.qty);

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="padding:30px; text-align:center; color:#666;">Material ini tidak ada di fasilitas manapun.</td></tr>';
            } else {
                items.forEach(item => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    row.style.transition = 'background 0.2s';
                    row.onmouseenter = () => row.style.background = 'rgba(188,19,254,0.1)';
                    row.onmouseleave = () => row.style.background = 'transparent';

                    row.innerHTML = `
                        <td style="padding:15px 30px; color:#cbd5e1; font-weight:700; font-family:'Orbitron'; font-size:0.9rem;">${item.name}</td>
                        <td style="padding:15px 30px; text-align:right; color:#fff; font-family:'Rajdhani'; font-weight:700; font-size:1.1rem;">${formatKgToTon(item.qty)} T</td>
                    `;
                    tbody.appendChild(row);
                });
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('warehouse-modal').style.display = 'none';
        }

        // Close on outside click
        window.onclick = function (event) {
            const modal = document.getElementById('warehouse-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // 1. DATA FETCHING
        async function initDashboard() {
            console.log("Initializing RM Stock Dashboard...");
            App.data = await DataService.fetchData();
            if (!App.data) return;

            App.liveData = typeof DataService.sanitizeRmDashboard === 'function'
                ? DataService.sanitizeRmDashboard(App.data)
                : App.data;

            applyRmDashboardData(App.liveData);

            var si = document.getElementById('rm-search-input');
            if (si) {
                si.addEventListener('input', function () {
                    clearTimeout(rmSearchTimer);
                    rmSearchTimer = setTimeout(rmRunMaterialSearch, 280);
                });
            }
        }

        // 2. RENDER FUNCTIONS (PIXEL PERFECT COPIES)

        function renderGlobalStats(stats) {
            const container = document.getElementById('global-stats');

            // Gunakan kapasitas dinamis dari API (Stats ditarik dari Spreadsheet Baris 141)
            const totalCap = stats.totalCapacity;
            const percentage = stats.percentage;

            let strokeColor = percentage > 80 ? '#ef4444' : (percentage > 60 ? '#ff9e0b' : '#00f3ff');
            let stroke = percentage + ", 100";

            container.innerHTML = `
                 <div class="stat-card" style="background:linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,10,10,0.95)); border:1px solid rgba(255,255,255,0.08); padding:1.5rem; border-left: 3px solid #00f3ff; border-radius:4px;">
                     <div class="stat-title" style="color:#94a3b8; font-size:0.8rem; font-weight:600; letter-spacing:1px; margin-bottom:5px;">CURRENT RM STOCK</div>
                     <div class="stat-value" style="color:#00f3ff; font-size:2rem; font-weight:700; font-family:'Rajdhani'">${formatKgToTon(stats.totalFilled)} <span class="unit" style="font-size:0.8rem; color:#64748b">TON</span></div>
                     <div class="stat-desc" style="color:#64748b; font-size:0.8rem;">Aggregation from all units</div>
                 </div>
                 <div class="stat-card" style="background:linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,10,10,0.95)); border:1px solid rgba(255,255,255,0.08); padding:1.5rem; border-left: 3px solid #ff9e0b; border-radius:4px;">
                     <div class="stat-title" style="color:#94a3b8; font-size:0.8rem; font-weight:600; letter-spacing:1px; margin-bottom:5px;">IDLE CAPACITY (EST)</div>
                     <div class="stat-value" style="color:#ff9e0b; font-size:2rem; font-weight:700; font-family:'Rajdhani'">${formatKgToTon(stats.totalSpace)} <span class="unit" style="font-size:0.8rem; color:#64748b">TON</span></div>
                     <div class="stat-desc" style="color:#64748b; font-size:0.8rem;">Based on hard-limit configuration</div>
                 </div>
                 <div class="stat-card" style="background:linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,10,10,0.95)); border:1px solid rgba(255,255,255,0.08); padding:1.5rem; display:flex; justify-content:space-between; align-items:center; border-left: 3px solid ${strokeColor}; border-radius:4px;">
                     <div>
                         <div class="stat-title" style="color:#94a3b8; font-size:0.8rem; font-weight:600; letter-spacing:1px; margin-bottom:5px;">UTILIZATION RATE</div>
                         <div class="stat-value" style="color:#fff; font-size:2rem; font-weight:700; font-family:'Rajdhani'">${percentage.toFixed(1)}%</div>
                         <div class="stat-desc" style="color:${strokeColor}; font-weight:bold; font-size:0.8rem;">${percentage > 80 ? 'CRITICAL LOAD' : (percentage > 60 ? 'HIGH LOAD' : 'OPTIMAL')}</div>
                     </div>
                     <div style="width:70px; height:70px;">
                         <svg viewBox="0 0 36 36">
                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-dasharray="${stroke}" />
                         </svg>
                     </div>
                 </div>`;
        }

        function renderWarehouseCards(data) {
            const container = document.getElementById('warehouse-display');
            container.innerHTML = '';

            // Permanent Extra Data Mapping
            const extraDataMap = {
                'RM': { std: '10,020', eff: '0.72', effCap: '7,215' },
                'GEBANG-A': { std: '2,700', eff: '1', effCap: '2,700' },
                'GEBANG-B': { std: '1,260', eff: '1', effCap: '1,260' },
                'SAMPING-C': { std: '2,882', eff: '0.95', effCap: '2,738' },
                'SAMPING-D': { std: '2,731', eff: '1', effCap: '2,731' },
                'SAMPING-E': { std: '3,957', eff: '0.98', effCap: '3,878' },
                'SAMPING-F': { std: '2,890', eff: '1', effCap: '2,890' },
                'GUDANG HINO': { std: '1,085', eff: '1', effCap: '1,085' },
                'GD.HINO': { std: '1,085', eff: '1', effCap: '1,085' },
                'GUDANG_HINO': { std: '1,085', eff: '1', effCap: '1,085' },
                'KOPO 6': { std: '1,600', eff: '1', effCap: '1,600' }
            };

            const maxCap = Math.max(...data.capacities) || 10000;
            const MAX_H = 180;

            // CANOPY GUDANG LIST
            const KANOPI_GUDANG = ['RM', 'GEBANG-A', 'SAMPING-C', 'GUDANG HINO', 'GD.HINO', 'GUDANG_HINO', 'HINO', 'KOPO 6'];

            // Split warehouses into rows — max 6 gudang per row
            const totalWh = data.warehouses.length;
            const PER_ROW = 6;
            const rows = [];
            for (let r = 0; r < totalWh; r += PER_ROW) {
                rows.push({ start: r, end: Math.min(r + PER_ROW, totalWh) });
            }

            // Function to generate label column
            function generateLabelColumn() {
                return `
                <div class="warehouse-card-header" style="flex:0 0 170px; display:flex; flex-direction:column; justify-content:flex-start; padding: 0 5px 0 0;">
                    <div style="height:1.2rem; margin-bottom:8px;"></div>
                    <div style="background:transparent; border:1px solid transparent; margin-bottom:12px; position:relative;">
                        <div style="padding:7px 0; border-bottom:1px solid transparent; display:flex; justify-content:flex-start;">
                            <span style="color:#94a3b8; font-size:0.7rem; font-family:'Inter'; text-transform:uppercase; letter-spacing:0.5px;">Kapasitas Standar (m²):</span>
                        </div>
                        <div style="padding:7px 0; border-bottom:1px solid transparent; display:flex; justify-content:flex-start;">
                            <span style="color:#94a3b8; font-size:0.7rem; font-family:'Inter'; text-transform:uppercase; letter-spacing:0.5px;">Faktor Efisiensi (%):</span>
                        </div>
                        <div style="padding:7px 0; border-bottom:1px solid transparent; display:flex; justify-content:flex-start;">
                            <span style="color:#94a3b8; font-size:0.7rem; font-family:'Inter'; text-transform:uppercase; letter-spacing:0.5px;">Kapasitas Efektif (m²):</span>
                        </div>
                    </div>
                    <div style="text-align:left;">
                        <div style="color:#94a3b8; font-size:0.95rem; font-family:'Rajdhani'; font-weight:600; margin-bottom:4px; height:18px; display:flex; align-items:flex-end;">Cap:</div>
                        <div style="color:#00f3ff; font-size:1.05rem; font-family:'Rajdhani'; font-weight:700; height:20px; display:flex; align-items:flex-end;">Stock:</div>
                        <div style="color:#94a3b8; font-size:0.7rem; font-family:'Inter'; font-weight:600; height:22px; display:flex; align-items:flex-end; margin-top:6px; letter-spacing:0.5px; text-transform:uppercase;">Kanopi:</div>
                    </div>
                </div>`;
            }

            // Function to generate a single warehouse card
            function generateWarehouseCard(name, index) {
                const nameKey = name.toUpperCase().replace(/\s+/g, '_').replace(/_+/g, '_');
                const nameKeySpaced = name.toUpperCase();
                // Auto-generate extra data for warehouses not in the hardcoded map
                let extra = extraDataMap[nameKeySpaced] || extraDataMap[nameKey] || null;
                if (!extra) {
                    // Auto: Faktor Efisiensi = 1, Kapasitas Efektif = Kapasitas Standar = dari data kapasitas
                    const capVal = data.capacities[index] || 0;
                    const capDisplay = capVal > 0 ? (capVal / 1000).toLocaleString('id-ID') : '-';
                    extra = { std: capDisplay, eff: '1', effCap: capDisplay };
                }
                const hasCanopy = KANOPI_GUDANG.includes(nameKeySpaced) || KANOPI_GUDANG.includes(nameKey);
                const capKg = data.capacities[index] || 0;
                let totalStockKg = 0;
                if (data.materials) {
                    data.materials.forEach(m => {
                        if (m.stocks && m.stocks[index]) totalStockKg += m.stocks[index];
                    });
                }
                const percent = capKg > 0 ? (totalStockKg / capKg) * 100 : 0;
                const visualH = Math.max((capKg / (maxCap * 1.2)) * MAX_H, 40);

                const isCritical = percent >= 85;
                const isHigh = percent >= 70;
                const fillColor = isCritical ? 'linear-gradient(to top, #ef4444, #991b1b)' :
                    (isHigh ? 'linear-gradient(to top, #f59e0b, #9a3412)' :
                        'linear-gradient(to top, #00f3ff, #0e7490)');
                const borderColor = isCritical ? '#ef4444' : (isHigh ? '#f59e0b' : '#00f3ff');

                let canopyBadgeHtml = '';
                if (hasCanopy) {
                    canopyBadgeHtml = `
                        <div style="margin-top:6px; text-align:center;">
                            <span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.55rem; font-family:'Inter'; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3);">
                                🏠 ADA KANOPI
                            </span>
                        </div>`;
                } else {
                    canopyBadgeHtml = `
                        <div style="margin-top:6px; text-align:center;">
                            <span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.55rem; font-family:'Inter'; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3);">
                                ☀️ TANPA KANOPI
                            </span>
                            ${isCritical ? `<div style="margin-top:4px; padding:3px 6px; border-radius:6px; font-size:0.5rem; font-family:'Inter'; font-weight:600; color:#fca5a5; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.25); line-height:1.3;">
                                ⚠️ Muat/Bongkar terhambat<br>harus di dalam gudang
                            </div>` : ''}
                        </div>`;
                }

                return `
                <div class="warehouse-card" style="flex:1; min-width:110px; max-width:200px; display:flex; flex-direction:column; position:relative; cursor:pointer; padding:0 4px;" onclick="openDetailModal(${index})">
                    <div class="wh-header" style="text-align:center; margin-bottom:auto; z-index:10;">
                        <div class="wh-name" style="font-family:'Orbitron'; font-size:0.85rem; letter-spacing:1px; color:#fff; font-weight:800; text-shadow:0 0 10px rgba(0,0,0,0.8); margin-bottom:8px; height: 1.2rem; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${name}</div>
                        <div style="background:linear-gradient(135deg, rgba(8,15,30,0.85) 0%, rgba(0,0,0,0.95) 100%); border:1px solid rgba(0,243,255,0.3); border-radius:6px; margin-bottom:12px; position:relative; overflow:hidden; box-shadow:0 0 10px rgba(0,243,255,0.1), inset 0 0 20px rgba(0,243,255,0.05);">
                            <div style="position:absolute; top:0; left:0; right:0; bottom:0; background-image:linear-gradient(rgba(0,243,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,243,255,0.08) 1px, transparent 1px); background-size:8px 8px; pointer-events:none; z-index:1;"></div>
                            <div style="position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, #00f3ff, transparent); z-index:2;"></div>
                            <div style="padding:7px 10px; border-bottom:1px solid rgba(0,243,255,0.15); display:flex; justify-content:flex-end; position:relative; z-index:3;">
                                <span style="color:#e2e8f0; font-size:0.75rem; font-family:'Inter'; font-weight:700; text-shadow:0 0 5px rgba(255,255,255,0.2);">${extra.std}</span>
                            </div>
                            <div style="padding:7px 10px; border-bottom:1px solid rgba(0,243,255,0.15); display:flex; justify-content:flex-end; position:relative; z-index:3;">
                                <span style="color:#00f3ff; font-size:0.75rem; font-family:'Inter'; font-weight:700; text-shadow:0 0 5px rgba(0,243,255,0.4);">${extra.eff}</span>
                            </div>
                            <div style="padding:7px 10px; display:flex; justify-content:flex-end; background:rgba(52,211,153,0.05); position:relative; z-index:3;">
                                <span style="color:#34d399; font-size:0.75rem; font-family:'Inter'; font-weight:700; text-shadow:0 0 5px rgba(52,211,153,0.4);">${extra.effCap}</span>
                            </div>
                        </div>
                        <div class="wh-cap" style="color:#cbd5e1; font-size:0.95rem; font-family:'Rajdhani'; font-weight:600; margin-bottom:4px; height:18px; display:flex; align-items:flex-end; justify-content:flex-end;">${(capKg / 1000).toLocaleString('id-ID')} T</div>
                        <div class="wh-stock" style="color:#00f3ff; font-size:1.05rem; font-family:'Rajdhani'; font-weight:700; height:20px; display:flex; align-items:flex-end; justify-content:flex-end;">${(totalStockKg / 1000).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} T</div>
                        ${canopyBadgeHtml}
                    </div>
                    <div style="height: ${MAX_H + 20}px; display:flex; flex-direction:column; justify-content:flex-end; margin-top:20px;">
                        <div class="wh-visual-bar" style="height:${visualH}px; width:100%; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.02); position:relative; overflow:hidden; border-radius:4px 4px 0 0;">
                            <div style="position:absolute; top:0; left:0; width:100%; height:100%; background-image:linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size:15px 15px;"></div>
                            <div class="wh-fill" style="position:absolute; bottom:0; left:0; width:100%; height:${Math.min(percent, 100)}%; background:${fillColor}; border-top:2px solid ${borderColor}; box-shadow: 0 0 15px ${borderColor}44; transition:height 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);"></div>
                            <div class="wh-label-overlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#fff; font-family:'Orbitron'; font-weight:900; font-size:1.1rem; text-shadow:0 0 10px #000; z-index:2;">${Math.round(percent)}%</div>
                        </div>
                        <div class="wh-footer" style="height:6px; background:#1e293b; border:1px solid rgba(255,255,255,0.1); border-top:none; border-radius:0 0 4px 4px;"></div>
                    </div>
                </div>`;
            }

            // Render 2 stacked rows
            rows.forEach((rowRange, rowIdx) => {
                // Skip row if empty
                if (rowRange.start >= totalWh) return;

                const rowDiv = document.createElement('div');
                rowDiv.className = 'warehouse-row';
                rowDiv.style.cssText = 'display:flex; gap:10px; align-items:stretch; overflow-x:auto; padding-bottom:15px; min-height:350px; padding-top:10px;';
                if (rowIdx > 0) {
                    rowDiv.style.marginTop = '30px';
                    rowDiv.style.borderTop = '1px solid rgba(255,255,255,0.06)';
                    rowDiv.style.paddingTop = '30px';
                }

                // Add label column for each row
                rowDiv.innerHTML = generateLabelColumn();

                // Add warehouse cards for this row
                for (let i = rowRange.start; i < rowRange.end; i++) {
                    rowDiv.innerHTML += generateWarehouseCard(data.warehouses[i], i);
                }

                container.appendChild(rowDiv);
            });
        }

        function renderAnalytics(analytics) {
            const tableContainer = document.getElementById('top-items-table');
            const maxVal = analytics.top10[0] ? analytics.top10[0].totalTon : 1;

            let html = `<table style="width:100%; border-collapse:separate; border-spacing:0 12px;">
                <thead>
                    <tr>
                        <th style="color:#64748b; font-size:0.7rem; text-align:left; padding-left:10px; font-weight:600; letter-spacing:1px;">RANK</th>
                        <th style="color:#64748b; font-size:0.7rem; text-align:left; font-weight:600; letter-spacing:1px;">MATERIAL</th>
                        <th style="color:#64748b; font-size:0.7rem; text-align:left; font-weight:600; letter-spacing:1px;">TOTAL (TON)</th>
                        <th style="color:#64748b; font-size:0.7rem; text-align:left; font-weight:600; letter-spacing:1px;">VISUAL</th>
                    </tr>
                </thead>
                <tbody>`;

            analytics.top10.forEach((item, index) => {
                const percent = (item.totalTon / maxVal) * 100;
                const rankColor = index === 0 ? '#00f3ff' : (index === 1 ? '#ffffff' : (index === 2 ? '#ff9e0b' : '#334155'));
                const textColor = index < 3 ? '#000' : '#fff';
                const glow = index === 0 ? 'box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);' : '';
                const safeName = item.name.replace(/'/g, "\\'");

                html += `
                <tr style="background:rgba(255,255,255,0.02); cursor:pointer; transition:background 0.2s;" onclick="openMaterialModal('${safeName}')" onmouseenter="this.style.background='rgba(188,19,254,0.1)'" onmouseleave="this.style.background='rgba(255,255,255,0.02)'">
                    <td style="padding:12px 10px; border-radius:10px 0 0 10px;">
                        <div style="width:24px; height:24px; background:${rankColor}; color:${textColor}; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Rajdhani'; font-size:0.9rem; ${glow}">
                            ${index + 1}
                        </div>
                    </td>
                    <td style="padding:12px 10px; color:#cbd5e1; font-weight:600; font-size:0.85rem;">${item.name}</td>
                    <td style="padding:12px 10px; font-weight:700; color:#fff; font-family:'Rajdhani'; font-size:1rem;">${item.totalTon.toLocaleString('id-ID', { maximumFractionDigits: 2 })}</td>
                    <td style="padding:12px 10px; border-radius:0 10px 10px 0;">
                        <div style="width:100px; height:6px; background:#334155; border-radius:4px; overflow:hidden;">
                            <div style="width:${percent}%; height:100%; background:#bc13fe; border-radius:4px; box-shadow: 0 0 10px #bc13fe;"></div>
                        </div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        }

        function renderCategoryStats(categories) {
            const container = document.getElementById('category-chart-container');
            if (!categories || categories.length === 0) return;

            let svg = '<svg viewBox="0 0 36 36" style="width:120px; height:120px; transform:rotate(-90deg); filter:drop-shadow(0 0 10px rgba(0,0,0,0.5));">';
            svg += '<path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4" />';

            let offset = 0;
            categories.forEach((cat, i) => {
                const color = ['#00f3ff', '#bc13fe', '#ff2a2a', '#ff9e0b', '#0aff0a'][i] || '#666';
                const dash = `${cat.percent} ${100 - cat.percent}`;
                svg += `<circle cx="18" cy="18" r="15.915" fill="transparent" stroke="${color}" stroke-width="4" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" stroke-linecap="round"></circle>`;
                offset += cat.percent;
            });
            svg += `<g transform="rotate(90 18 18)">
               <text x="18" y="16" text-anchor="middle" dy=".3em" style="fill:white; font-family:'Rajdhani'; font-size:10px; font-weight:800;">${categories.length}</text>
               <text x="18" y="23" text-anchor="middle" dy=".3em" style="fill:#aaa; font-family:'Plus Jakarta Sans'; font-size:3px; font-weight:600; text-transform:uppercase;">Jenis</text>
           </g>`;
            svg += '</svg>';

            let legend = '<div style="flex:1; margin-left:20px; display:flex; flex-direction:column; justify-content:center;">';
            categories.forEach((cat, i) => {
                const color = ['#00f3ff', '#bc13fe', '#ff2a2a', '#ff9e0b', '#0aff0a'][i] || '#666';
                legend += `
                   <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.03); padding-bottom:4px;">
                       <div style="display:flex; align-items:center; gap:8px;">
                           <div style="width:8px; height:8px; border-radius:2px; background:${color}; box-shadow:0 0 5px ${color};"></div>
                           <span style="color:#cbd5e1; font-size:0.75rem; font-weight:500;">${cat.name}</span>
                       </div>
                       <div style="text-align:right;">
                           <div style="color:#fff; font-weight:700; font-family:'Rajdhani'; font-size:0.85rem;">${Math.round(cat.totalTon).toLocaleString('id-ID')}T</div>
                       </div>
                   </div>
               `;
            });
            legend += '</div>';

            container.innerHTML = svg + legend;
        }

        // Initialize
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            // GLOBAL VERIFICATION VIA API
            let isValid = false;
            try {
                if (token) {
                    const url = `${CONFIG.API_URL}?action=getShareStatus&t=${Date.now()}`;
                    let status = null;
                    try {
                        const resp = await fetch(url);
                        if (resp.ok) status = await resp.json();
                    } catch (e) {
                        console.warn("Verification fetch failed, trying JSONP...", e);
                    }

                    if (!status && typeof DataService.fetchJSONP === 'function') {
                        status = await DataService.fetchJSONP(url);
                    }

                    if (status && status.active && status.token === token) {
                        isValid = true;
                    }
                }
            } catch (err) {
                console.error("Verification failed:", err);
            }

            if (!isValid) {
                document.body.innerHTML = `
                    <div style="display:flex; height:100vh; justify-content:center; align-items:center; flex-direction:column; background:#050505; color:#fff; font-family:'Orbitron';">
                        <i class="fas fa-lock" style="font-size:4rem; color:#ef4444; margin-bottom:20px;"></i>
                        <h2 style="letter-spacing:2px; font-weight:900;">ACCESS DENIED</h2>
                        <div style="color:#64748b; margin-top:10px; font-family:'Inter'; text-align:center;">
                            Sesi telah kedaluwarsa, tidak valid, atau dinonaktifkan oleh Administrator.<br>
                            Silakan minta tautan akses yang baru.
                        </div>
                    </div>
                `;
                return;
            }

            try {
                initDashboard();
                startClock();
            } catch (err) {
                console.error("Dashboard init error:", err);
            } finally {
                // Hide loading overlay after initialization
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.classList.add('hidden');
                }, 1000);
            }
        };

        function startClock() {
            const update = () => {
                const now = new Date();
                const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
                const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

                const dayEl = document.getElementById('widget-day');
                const dateEl = document.getElementById('widget-date');
                if (dayEl) dayEl.innerText = days[now.getDay()];
                if (dateEl) dateEl.innerText = `${months[now.getMonth()]} ${now.getDate()}`;

                let h = now.getHours();
                const m = String(now.getMinutes()).padStart(2, '0');
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12;
                h = h ? h : 12;
                const hStr = h;

                const timeEl = document.getElementById('widget-time');
                const ampmEl = document.getElementById('widget-ampm');
                if (timeEl) timeEl.innerText = `${hStr}:${m}`;
                if (ampmEl) ampmEl.innerText = ampm;

                const sec = now.getSeconds();
                const progressEl = document.getElementById('widget-sec-progress');
                if (progressEl) {
                    const deg = (sec / 60) * 360;
                    progressEl.style.transform = `rotate(${deg - 45}deg)`;
                }
            };
            update();
            setInterval(update, 1000);
        }


    </script>
</body>
