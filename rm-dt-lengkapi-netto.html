<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Data Netto - DT V2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app-config.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-primary: #0284c7;
            --accent-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scrollbar-width: thin;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 100% 0%, #ffffff 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, #e2e8f0 0%, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- SCI-FI HUD LOADER --- */
        #app-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
            visibility: hidden; opacity: 0;
            color: white;
        }
        #app-loader.active { visibility: visible; opacity: 1; }

        .hud-container {
            display: flex; align-items: center; gap: 30px;
            padding: 40px; border-radius: 20px;
            background: rgba(0, 245, 255, 0.05); border: 1px solid rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.1);
        }

        .hud-circle-wrap { position: relative; width: 120px; height: 120px; }
        .hud-circle-bg { 
            position: absolute; inset: 0; border: 4px solid rgba(0, 245, 255, 0.1); border-radius: 50%; 
        }
        .hud-circle-progress {
            position: absolute; inset: 0; border: 4px solid #00f5ff; border-radius: 50%;
            border-top-color: transparent; border-left-color: transparent;
            transform: rotate(-45deg); transition: transform 0.3s;
            filter: drop-shadow(0 0 8px #00f5ff);
        }
        .hud-pct {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: #00f5ff;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .hud-bar-wrap { width: 350px; }
        .hud-label {
            display: flex; justify-content: space-between; align-items: center;
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: #00f5ff;
            letter-spacing: 2px; margin-bottom: 12px; font-weight: 700;
        }
        .hud-segments { display: flex; gap: 4px; height: 25px; }
        .hud-seg {
            flex: 1; background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.2);
            transition: all 0.2s;
        }
        .hud-seg.active {
            background: #00f5ff; box-shadow: 0 0 15px #00f5ff; border-color: #fff;
        }

        .hud-decor { 
            margin-top: 20px; font-size: 0.55rem; color: rgba(0, 245, 255, 0.5); 
            font-family: monospace; letter-spacing: 1px;
        }

        @keyframes hudPulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        .loading-text-scan { animation: hudPulse 1s infinite alternate; }

        @media (max-width: 600px) {
            .hud-container { flex-direction: column; gap: 20px; padding: 25px; }
            .hud-bar-wrap { width: 260px; }
        }

        /* --- HEADERS --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .user-control-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 8px 18px;
            border-radius: 30px;
            color: var(--accent-primary);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .user-profile-badge span {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .user-profile-badge i { font-size: 1.4rem; }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .back-nav:hover {
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent-primary);
            transform: translateX(-5px);
        }

        /* Task Container */
        .task-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- CARDS & LISTS --- */
        .user-group {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .user-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .user-group-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .badge-count {
            background: var(--warning);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .task-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            transform: translateY(-2px);
            background: #ffffff;
        }
        
        .task-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--warning);
        }

        .tc-nopol {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tc-material {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        
        .tc-date {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            color: var(--success);
            margin-bottom: 5px;
        }

        /* Loading Spinner */
        #loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--accent-primary);
        }
        
        .spinner {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .top-header { padding: 15px 20px; flex-direction: column; gap: 10px; align-items: flex-start; }
            .user-control-panel { align-items: flex-start; width: 100%; }
            .main-content { padding: 15px; }
            .task-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- --- PREMIUM SCI-FI HUD LOADER --- -->
    <div id="app-loader">
        <div class="hud-container">
            <div class="hud-circle-wrap">
                <div class="hud-circle-bg"></div>
                <div class="hud-circle-progress" id="hud-circle-node"></div>
                <div class="hud-pct" id="hud-pct-text">0%</div>
            </div>
            <div class="hud-bar-wrap">
                <div class="hud-label">
                    <span class="loading-text-scan">ESTABLISHING DATA CONNECTION</span>
                    <span id="hud-status-node">0/24 SEC</span>
                </div>
                <div class="hud-segments" id="hud-segments-wrap">
                    <!-- Segments generated by JS -->
                </div>
                <div class="hud-decor">
                    <i class="fas fa-microchip"></i> SYSTEM_SYNC_V2.0 // ANALYTICS_ENGINE // TONASE_NETTO_REALTIME
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Barrier (Gagal Login) -->
    <div id="login-overlay" style="display:none;">
        <div class="barrier-content">
            <i class="fas fa-lock" style="font-size: 4rem; color: var(--danger); margin-bottom: 20px;"></i>
            <h2 style="font-family:'Orbitron'; font-size:1.5rem; margin-bottom:10px;">AKSES DITOLAK</h2>
            <p>Sesi login tidak ditemukan. Harap login melalui Hub DT V2.</p>
            <a href="rm-dt-v2.html" class="user-profile-badge" style="display:inline-flex; text-decoration:none; margin-top:20px; background:white; color:var(--text-primary);"><i class="fas fa-arrow-left"></i> KEMBALI</a>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-wrapper" id="app-wrapper" style="opacity: 0;">
        <header class="top-header">
            <div class="header-title-area">
                <div class="header-title">
                    <h2>LENGKAPI DATA NETTO</h2>
                    <p>Pembaruan Tonase Data Bongkaran</p>
                </div>
            </div>
            
            <div class="user-control-panel">
                <div class="user-profile-badge">
                    <i class="fas fa-user-shield"></i>
                    <span id="display-username">GUEST</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <a href="rm-dt-v2.html" class="back-nav"><i class="fas fa-arrow-left"></i> KEMBALI KE MENU UTAMA</a>

            <!-- DYNAMIC TARGET CONTAINER -->

            <div class="task-container" id="tasks-master-container" style="display:none;">
                <!-- DYNAMIC CONTENT GOES HERE -->
            </div>
            
        </main>
    </div>

    <script>
        // Use Entry Bongkar API URL - handle getTaskQueue, getData, and updateNetto
        console.warn("DIAGNOSTIC - ACTIVE CONFIG URL:", CONFIG.ENTRY_BONGKAR_API_URL);
        const API_URL = CONFIG.ENTRY_BONGKAR_API_URL;
        let currentUser = "";
        let isManager = false;
        const MANAGERS = ['ARIF', 'CECEP', 'ADE', 'SAFII', 'HADI'];
        let loaderInterval;

        // --- HUD LOADER FUNCTIONS ---
        function showLoader(status = "ESTABLISHING CONNECTION") {
            const wrap = document.getElementById('hud-segments-wrap');
            if (wrap.children.length === 0) {
                for(let i=0; i<24; i++) {
                    const seg = document.createElement('div');
                    seg.className = 'hud-seg';
                    wrap.appendChild(seg);
                }
            } else {
                Array.from(wrap.children).forEach(s => s.classList.remove('active'));
            }
            const statusNode = document.querySelector('.loading-text-scan');
            if(statusNode) statusNode.innerText = status;
            document.getElementById('app-loader').classList.add('active');
            let pct = 0;
            if (loaderInterval) clearInterval(loaderInterval);
            loaderInterval = setInterval(() => {
                if (pct < 98) {
                    pct += Math.random() * 5;
                    if (pct > 98) pct = 98;
                    updateHUD(Math.floor(pct));
                }
            }, 100);
        }

        function updateHUD(pct) {
            const segs = document.getElementById('hud-segments-wrap').children;
            const activeCount = Math.floor((pct/100) * 24);
            for(let i=0; i<24; i++) {
                if (i < activeCount) segs[i].classList.add('active');
                else segs[i].classList.remove('active');
            }
            const pctText = document.getElementById('hud-pct-text');
            if(pctText) pctText.innerText = `${pct}%`;
            const circle = document.getElementById('hud-circle-node');
            if(circle) circle.style.transform = `rotate(${(pct/100)*360 - 45}deg)`;
            const statusNode = document.getElementById('hud-status-node');
            if(statusNode) statusNode.innerText = `${activeCount}/24 SEG`;
        }

        function hideLoader() {
            updateHUD(100);
            if (loaderInterval) clearInterval(loaderInterval);
            setTimeout(() => {
                document.getElementById('app-loader').classList.remove('active');
            }, 600);
        }

        document.addEventListener('DOMContentLoaded', () => {
            showLoader("AUTHENTICATING ENGINE");
            const userStr = sessionStorage.getItem('dt_v2_user');
            if (!userStr) {
                document.getElementById('login-overlay').style.display = 'flex';
                hideLoader();
                return;
            }

            currentUser = userStr;
            isManager = MANAGERS.includes(currentUser.toUpperCase());
            
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-wrapper').style.opacity = '1';
            document.getElementById('display-username').innerText = currentUser.toUpperCase();

            loadPendingData();
        });

        async function loadPendingData() {
            try {
                if (isManager) {
                    await loadDataManagerView();
                } else {
                    await loadDataForUser(currentUser);
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Koneksi Gagal', 'Gagal memuat daftar tugas dari server.', 'error');
                showEmptyState(true);
            }
        }

        // === FLOW UNTUK USER BIASA (KRANI) ===
        async function loadDataForUser(username) {
            const cb = Date.now();
            const url = `${API_URL}?action=getTaskQueue&role=krani&name=${encodeURIComponent(username)}&_cb=${cb}`;
            console.log("Fetching Tasks from:", url);

            const res = await fetch(url);
            const rawData = await res.json();
            
            // Safety: Ensure rawData is an array
            if (!Array.isArray(rawData)) {
                console.warn("Unexpected API response (not an array):", rawData);
                
                // DIAGNOSTIK BARU: Cek jika ini data dashboard
                if (rawData.status === 'success' && rawData.template) {
                    throw new Error("Server mengirimkan data Dashboard/Analitik alih-alih daftar tugas. Pastikan URL API sudah benar.");
                }
                
                if (rawData.message && rawData.message.includes("Unknown Action")) {
                    throw new Error("Server tidak mengenali perintah 'getTaskQueue'. Silakan lakukan 'New Deployment' di Apps Script Editor.");
                }

                throw new Error("Data yang diterima bukan format daftar tugas.");
            }

            // Filter out empty rows or header rows just in case
            const data = rawData.filter(t => t.nopol && t.nopol !== "NOPOL" && t.nopol.trim() !== "");

            const container = document.getElementById('tasks-master-container');
            container.style.display = 'block';

            if (!data || data.length === 0) {
                showEmptyState(false);
                hideLoader();
                return;
            }

            const groupHtml = buildUserGroupHtml(username, data);
            container.innerHTML = groupHtml;
            hideLoader();
        }

        // === FLOW KHUSUS UNTUK MANAGER (ARIF, CECEP, DLL) ===
        async function loadDataManagerView() {
            const cb = Date.now();
            // 1. Ambil list semua pendingKranis
            const res = await fetch(`${API_URL}?action=getData&_cb=${cb}`);
            const rawData = await res.json();
            
            if (rawData.version) console.log("Backend SCRIPT_VERSION (Manager):", rawData.version);

            if (!rawData.success || !rawData.pendingKranis) {
                console.warn("API Error (Manager View):", rawData);
                throw new Error("Gagal mendapatkan status data pending.");
            }

            if (rawData.pendingKranis.length === 0) {
                document.getElementById('tasks-master-container').style.display = 'block';
                showEmptyState(false);
                hideLoader();
                return;
            }

            let finalHtml = '';
            // 2. Loop setiap krani & fetch tasknya
            for (let krani of rawData.pendingKranis) {
                const url = `${API_URL}?action=gettaskqueue&role=krani&name=${encodeURIComponent(krani)}&_cb=${cb}`;
                const kRes = await fetch(url);
                const kRawData = await kRes.json();
                
                // Filter valid tasks
                if (Array.isArray(kRawData)) {
                    const kData = kRawData.filter(t => t.nopol && t.nopol !== "NOPOL" && t.nopol.trim() !== "");
                    
                    if (kData && kData.length > 0) {
                        finalHtml += buildUserGroupHtml(krani, kData);
                    }
                }
            }

            const container = document.getElementById('tasks-master-container');
            container.style.display = 'block';

            if (finalHtml === '') {
                showEmptyState(false);
            } else {
                container.innerHTML = finalHtml;
            }
            hideLoader();
        }

        // === RENDER UI HELPER ===
        function buildUserGroupHtml(username, tasks) {
            let headerHtml = '';
            if (isManager) {
                headerHtml = `
                    <div class="user-group-header">
                        <h3><i class="fas fa-user-circle"></i> USER: ${username}</h3>
                        <span class="badge-count">${tasks.length} PENDING</span>
                    </div>
                `;
            }

            let html = `
            <div class="user-group">
                ${headerHtml}
                <div class="task-list">`;
            
            tasks.forEach(task => {
                const safeTask = encodeURIComponent(JSON.stringify(task));
                html += `
                    <div class="task-card" onclick="openInputNetto('${safeTask}')">
                        <div class="tc-nopol">
                            <span>${task.nopol || 'NO NOPOL'}</span>
                            <i class="fas fa-edit" style="color:var(--accent-primary); font-size:1rem;"></i>
                        </div>
                        <div class="tc-material"><i class="fas fa-box"></i> ${task.material || '-'}</div>
                        <div class="tc-date"><i class="fas fa-calendar-alt"></i> ${task.tanggal || '-'}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        function showEmptyState(isError) {
            const container = document.getElementById('tasks-master-container');
            if(isError) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i>
                        <h3 style="color:var(--danger)">Gagal Sinkronisasi</h3>
                        <p>Koneksi ke server terputus.</p>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h3>Semua Data Lengkap</h3>
                        <p>Tidak ada data bongkaran yang nettonya kosong.</p>
                    </div>`;
            }
        }

        // === UPDATE LOGIC ===
        async function openInputNetto(encodedTask) {
            const task = JSON.parse(decodeURIComponent(encodedTask));

            const { value: formValues } = await Swal.fire({
                title: 'Input Netto & Keterangan',
                html: `
                    <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:15px; text-align:left;">
                        <p style="margin-bottom:10px;"><b>[${task.nopol}]</b> - ${task.material}<br>
                        Tanggal: ${task.tanggal}</p>
                        
                        <label for="swal-input-netto" style="display:block; margin-bottom:5px; font-weight:600;">Netto (Kg)</label>
                        <input id="swal-input-netto" class="swal2-input" type="number" placeholder="Masukkan angka Netto..." style="width:100%; margin: 0 0 15px 0;">
                        
                        <label for="swal-input-ket" style="display:block; margin-bottom:5px; font-weight:600;">Keterangan (Opsional)</label>
                        <textarea id="swal-input-ket" class="swal2-textarea" placeholder="Tambahkan catatan jika ada..." style="width:100%; margin:0; height:80px;"></textarea>
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: '#0284c7',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<i class="fas fa-save"></i> Simpan',
                cancelButtonText: 'Batal',
                preConfirm: () => {
                    const netto = document.getElementById('swal-input-netto').value;
                    const ket = document.getElementById('swal-input-ket').value;
                    
                    if (!netto) {
                        Swal.showValidationMessage('Netto tidak boleh kosong!');
                        return false;
                    }
                    if (Number(netto) <= 0) {
                        Swal.showValidationMessage('Netto harus lebih dari 0!');
                        return false;
                    }
                    return { netto: netto, keterangan: ket };
                }
            });

            if (formValues) {
                saveNettoToServer(task, formValues.netto, formValues.keterangan);
            }
        }

        async function saveNettoToServer(task, netto, keterangan) {
            Swal.fire({
                title: 'Menyimpan Data...',
                html: 'Tunggu sebentar, sedang mengupdate server',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                action: "updateNetto",
                sheet_name: task.sheet_name,
                row_id: task.row_id,
                netto: netto,
                keterangan: keterangan
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Tersimpan!',
                        text: 'Data nettonya berhasil diupdate.',
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        // Reload data
                        document.getElementById('tasks-master-container').style.display = 'none';
                        showLoader("REFRESHING DATA QUEUE");
                        loadPendingData();
                    });
                } else {
                    throw new Error(result.error || "Unknown Error");
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Gagal Menyimpan', 'Terjadi kesalahan sistem: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
