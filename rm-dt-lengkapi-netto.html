<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Data Netto - DT V2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app-config.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-primary: #0284c7;
            --accent-light: #e0f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scrollbar-width: thin;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 100% 0%, #ffffff 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, #e2e8f0 0%, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- OVERLAYS --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
            backdrop-filter: blur(25px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .barrier-content {
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            max-width: 90%;
            width: 400px;
        }

        /* --- HEADERS --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .user-control-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 8px 18px;
            border-radius: 30px;
            color: var(--accent-primary);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .user-profile-badge span {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .user-profile-badge i { font-size: 1.4rem; }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .back-nav:hover {
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent-primary);
            transform: translateX(-5px);
        }

        /* Task Container */
        .task-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- CARDS & LISTS --- */
        .user-group {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .user-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .user-group-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .badge-count {
            background: var(--warning);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .task-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            transform: translateY(-2px);
            background: #ffffff;
        }
        
        .task-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--warning);
        }

        .tc-nopol {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tc-material {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        
        .tc-date {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            color: var(--success);
            margin-bottom: 5px;
        }

        /* Loading Spinner */
        #loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--accent-primary);
        }
        
        .spinner {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .top-header { padding: 15px 20px; flex-direction: column; gap: 10px; align-items: flex-start; }
            .user-control-panel { align-items: flex-start; width: 100%; }
            .main-content { padding: 15px; }
            .task-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Auth Barrier -->
    <div id="login-overlay">
        <div class="barrier-content">
            <i class="fas fa-lock" style="font-size: 4rem; color: var(--danger); margin-bottom: 20px;"></i>
            <h2 style="font-family:'Orbitron'; font-size:1.5rem; margin-bottom:10px;">AKSES DITOLAK</h2>
            <p>Sesi login tidak ditemukan. Harap login melalui Hub DT V2.</p>
            <a href="rm-dt-v2.html" class="user-profile-badge" style="display:inline-flex; text-decoration:none; margin-top:20px; background:white; color:var(--text-primary);"><i class="fas fa-arrow-left"></i> KEMBALI</a>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-wrapper" id="app-wrapper" style="opacity: 0;">
        <header class="top-header">
            <div class="header-title-area">
                <div class="header-title">
                    <h2>LENGKAPI DATA NETTO</h2>
                    <p>Pembaruan Tonase Data Bongkaran</p>
                </div>
            </div>
            
            <div class="user-control-panel">
                <div class="user-profile-badge">
                    <i class="fas fa-user-shield"></i>
                    <span id="display-username">GUEST</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <a href="rm-dt-v2.html" class="back-nav"><i class="fas fa-arrow-left"></i> KEMBALI KE MENU UTAMA</a>

            <div id="loading-view">
                <i class="fas fa-satellite-dish spinner"></i>
                <h3 style="font-family:'Rajdhani', sans-serif; font-size:1.5rem;">Mengsinkronisasi Data...</h3>
                <p style="font-size:0.85rem; color:var(--text-secondary);">Mencari tugas pending muatan...</p>
            </div>

            <div class="task-container" id="tasks-master-container" style="display:none;">
                <!-- DYNAMIC CONTENT GOES HERE -->
            </div>
            
        </main>
    </div>

    <script>
        // Use Downtime API URL - this is where getTaskQueue, getData, and updateNetto handlers live
        const API_URL = CONFIG.DOWNTIME_API_URL;
        let currentUser = "";
        let isArif = false;

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('dt_v2_user');
            if (!userStr) {
                // Not Logged In
                return;
            }

            currentUser = userStr;
            isArif = (currentUser.toUpperCase() === 'ARIF');
            
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-wrapper').style.opacity = '1';
            document.getElementById('display-username').innerText = currentUser.toUpperCase();

            loadPendingData();
        });

        async function loadPendingData() {
            try {
                if (isArif) {
                    await loadDataForArif();
                } else {
                    await loadDataForUser(currentUser);
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Koneksi Gagal', 'Gagal memuat daftar tugas dari server.', 'error');
                showEmptyState(true);
            }
        }

        // === FLOW UNTUK USER BIASA (KRANI) ===
        async function loadDataForUser(username) {
            const res = await fetch(`${API_URL}?action=getTaskQueue&role=krani&name=${encodeURIComponent(username)}`);
            const rawData = await res.json();
            
            // Filter out empty rows or header rows just in case
            const data = (rawData || []).filter(t => t.nopol && t.nopol !== "NOPOL" && t.nopol.trim() !== "");

            document.getElementById('loading-view').style.display = 'none';
            const container = document.getElementById('tasks-master-container');
            container.style.display = 'block';

            if (!data || data.length === 0) {
                showEmptyState(false);
                return;
            }

            const groupHtml = buildUserGroupHtml(username, data);
            container.innerHTML = groupHtml;
        }

        // === FLOW KHUSUS UNTUK ARIF ===
        async function loadDataForArif() {
            // 1. Ambil list semua pendingKranis
            const res = await fetch(`${API_URL}?action=getData`);
            const rawData = await res.json();
            
            if (!rawData.success || !rawData.pendingKranis || rawData.pendingKranis.length === 0) {
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('tasks-master-container').style.display = 'block';
                showEmptyState(false);
                return;
            }

            let finalHtml = '';
            // 2. Loop setiap krani & fetch tasknya
            for (let krani of rawData.pendingKranis) {
                const kRes = await fetch(`${API_URL}?action=getTaskQueue&role=krani&name=${encodeURIComponent(krani)}`);
                const kRawData = await kRes.json();
                
                // Filter valid tasks
                const kData = (kRawData || []).filter(t => t.nopol && t.nopol !== "NOPOL" && t.nopol.trim() !== "");
                
                if (kData && kData.length > 0) {
                    finalHtml += buildUserGroupHtml(krani, kData);
                }
            }

            document.getElementById('loading-view').style.display = 'none';
            const container = document.getElementById('tasks-master-container');
            container.style.display = 'block';

            if (finalHtml === '') {
                showEmptyState(false);
            } else {
                container.innerHTML = finalHtml;
            }
        }

        // === RENDER UI HELPER ===
        function buildUserGroupHtml(username, tasks) {
            let headerHtml = '';
            if (isArif) {
                headerHtml = `
                    <div class="user-group-header">
                        <h3><i class="fas fa-user-circle"></i> USER: ${username}</h3>
                        <span class="badge-count">${tasks.length} PENDING</span>
                    </div>
                `;
            }

            let html = `
            <div class="user-group">
                ${headerHtml}
                <div class="task-list">`;
            
            tasks.forEach(task => {
                const safeTask = encodeURIComponent(JSON.stringify(task));
                html += `
                    <div class="task-card" onclick="openInputNetto('${safeTask}')">
                        <div class="tc-nopol">
                            <span>${task.nopol || 'NO NOPOL'}</span>
                            <i class="fas fa-edit" style="color:var(--accent-primary); font-size:1rem;"></i>
                        </div>
                        <div class="tc-material"><i class="fas fa-box"></i> ${task.material || '-'}</div>
                        <div class="tc-date"><i class="fas fa-calendar-alt"></i> ${task.tanggal || '-'}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        function showEmptyState(isError) {
            const container = document.getElementById('tasks-master-container');
            if(isError) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i>
                        <h3 style="color:var(--danger)">Gagal Sinkronisasi</h3>
                        <p>Koneksi ke server terputus.</p>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h3>Semua Data Lengkap</h3>
                        <p>Tidak ada data bongkaran yang nettonya kosong.</p>
                    </div>`;
            }
        }

        // === UPDATE LOGIC ===
        async function openInputNetto(encodedTask) {
            const task = JSON.parse(decodeURIComponent(encodedTask));

            const { value: nettoVal } = await Swal.fire({
                title: 'Input Netto (Kg)',
                html: `
                    <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:15px;">
                        <b>[${task.nopol}]</b> - ${task.material}<br>
                        Tanggal: ${task.tanggal}
                    </div>
                `,
                input: 'number',
                inputPlaceholder: 'Masukkan angka Netto...',
                showCancelButton: true,
                confirmButtonColor: '#0284c7',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<i class="fas fa-save"></i> Simpan',
                cancelButtonText: 'Batal',
                inputValidator: (value) => {
                    if (!value) {
                        return 'Netto tidak boleh kosong!';
                    }
                    if (Number(value) <= 0) {
                        return 'Netto harus lebih dari 0!';
                    }
                }
            });

            if (nettoVal) {
                saveNettoToServer(task.row_id, nettoVal);
            }
        }

        async function saveNettoToServer(rowId, netto) {
            Swal.fire({
                title: 'Menyimpan Data...',
                html: 'Tunggu sebentar, sedang mengupdate server',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                action: "updateNetto",
                role: "krani",
                row_id: rowId,
                netto: netto
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Tersimpan!',
                        text: 'Data nettonya berhasil diupdate.',
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        // Reload data
                        document.getElementById('tasks-master-container').style.display = 'none';
                        document.getElementById('loading-view').style.display = 'flex';
                        loadPendingData();
                    });
                } else {
                    throw new Error(result.error || "Unknown Error");
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Gagal Menyimpan', 'Terjadi kesalahan sistem: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
